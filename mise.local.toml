[tasks."copilot:build"]
description = "Build the local github-copilot-cli-in-docker image"
run = "docker build -t local/copilot-cli ./local/copilot-cli"

[tasks."copilot:run"]
description = "Smoke-test one model via GitHub Copilot CLI (BYOK) against the LiteLLM proxy: `MODEL=<name> mise run copilot:run`. Override COPILOT_PROVIDER_BASE_URL / COPILOT_PROVIDER_API_KEY to target a non-local proxy (e.g. the dev cluster that serves gpt-5.5)."
run = '''
set +e
MODEL="${MODEL:-gpt-5.5}"
docker image inspect local/copilot-cli >/dev/null 2>&1 || docker build -t local/copilot-cli ./local/copilot-cli
base_url="${COPILOT_PROVIDER_BASE_URL:-http://host.docker.internal:4000/v1}"
api_key="${COPILOT_PROVIDER_API_KEY:-sk-1234}"
mkdir -p "$PWD/local/copilot-sandbox"
errfile=$(mktemp)
stdout=$(docker run --rm \
  -e COPILOT_PROVIDER_BASE_URL="$base_url" \
  -e COPILOT_PROVIDER_API_KEY="$api_key" \
  -e COPILOT_MODEL="$MODEL" \
  -v "$PWD/local/copilot-sandbox:/workspace" \
  local/copilot-cli -p "what day is it" -s --allow-all-tools 2>"$errfile")
status=$?
stderr=$(cat "$errfile"); rm -f "$errfile"
trimmed=$(printf %s "$stdout" | tr -d '[:space:]')
if [ $status -eq 0 ] && [ -n "$trimmed" ]; then
  last=$(printf %s "$stdout" | awk 'NF{line=$0} END{print line}')
  echo "[PASS] $MODEL :: $last"
else
  reason=$(printf %s "$stderr" | awk 'NF{line=$0} END{print line}')
  echo "[FAIL] $MODEL :: exit=$status stdout=${stdout:-<empty>} stderr_last=${reason:-<empty>}"
  exit 1
fi
'''

[tasks."copilot:test-all"]
description = "Smoke-test the Copilot model matrix sequentially; print PASS/FAIL summary. Set MODELS=\"a b c\" to override the default (gpt-5.5)."
run = '''
set +e
pass=0
fail=0
for m in ${MODELS:-gpt-5.5}; do
  if MODEL="$m" mise run copilot:run; then
    pass=$((pass + 1))
  else
    fail=$((fail + 1))
  fi
done
echo "Summary: $pass passed, $fail failed"
[ "$fail" -eq 0 ]
'''
